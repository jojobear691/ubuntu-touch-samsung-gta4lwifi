[Service]
# The delayed camera fix replaces cameraserver after the user trust broker
# has already connected. Restart the broker once so it reconnects instead of
# spinning on EOF from the old camera-service socket.
ExecStartPost=/usr/sbin/runuser -u phablet -- /usr/bin/env XDG_RUNTIME_DIR=/run/user/32011 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/32011/bus /usr/bin/systemctl --user restart cameraservice-trust-stored.service
